# LR-TinySwin 반증 — LR-Fuse L1_11(0.5439M)과 params 매칭(w128)해 기전만 비교.
# w64(0.19M)는 기각된 L1 의 1/3 용량이라 실패가 과잉결정돼 질문에 답하지 못한다.
# 실측 params 0.6103M. 계획: research_log/2026-08-29_swin-final-24h-plan.md
expect_params_m: 0.6103
seed: 2025
num_worker: 4
work_dir: /home/knuvi/Desktop/song/PAN-Crafter/work_dir/LR_SW2_w128

phase: train

# KNOWN_ISSUES.md E-1: 검증셋으로 best 를 고른다. 테스트셋은 곡선 기록용으로만 본다.
select_on: hqnr

# feeder
feeder: feeders.feeder.PanFeeder
train_feeder_args:
  dataroot: /home/knuvi/Desktop/song/PAN-Crafter/data/PanCollection/WV3/train_wv3.h5
  crop: False
  hflip: True
  vflip: True
  rot: True
  crop_ratio: 0.75
  ms_size: 16

val_feeder_args:
  dataroot: /home/knuvi/Desktop/song/PAN-Crafter/data/PanCollection/WV3/valid_wv3.h5

test_reduced_feeder_args:
  dataroot: /home/knuvi/Desktop/song/PAN-Crafter/data/PanCollection/WV3/reduced_examples_h5/test_wv3_multiExm1.h5

test_full_feeder_args:
  dataroot: /home/knuvi/Desktop/song/PAN-Crafter/data/PanCollection/WV3/full_examples_h5_repaired/test_wv3_OrigScale_multiExm1.h5

# data
num_bands: 8
max_pixel: 2047.0

# model
model: model.lr_tinyswin.LRTinySwin
model_args:
  in_channels: 1
  out_channels: 8
  hidden_size: 128
  swin_depth: 2             # W→SW 한 쌍
  scale: 4
  num_heads: 4
  window_size: 8
  mlp_ratio: 2.0
  in_mode: released         # 11ch 철학 — L1_11(LR-Fuse) 과 같은 입력으로 기전만 비교

# optim
optimizer: AdamW
learning_rate: 1e-4
weight_decay: 0.01
lr_scheduler: cosine
num_iter: 50000
num_warmup: 100

# loss
res: True
w_off: 1.0

# logging
log_iter: 100
save_iter: 10000
save_epoch: 25
eval_epoch: 5

# training
gpu: 0
batch_size: 48  # duplicate
test_batch_size: 1