# 조합 제거 실험 (자동 생성). 제거: 고주파 채널 제거, AttnBlock mode gate 제거, decoder H/4 CM3A 제거, ResBlock mode 변조 제거
# 단일 실험 열화 합계 예상 +1.56% — 실제와 비교해 가산성 확인
# Student 아키텍처 스윕. research_log/pancrafter_student_first_strategy_v0.1.md 기반.
# W128D2222A3: width 128 / depth [2, 2, 2, 2] / CM3A 3개
# Teacher 와 동일: seed 2025, batch 48(실효 96), AdamW 1e-4 wd 0.01, cosine+warmup 100, select_on val
# 스윕 전용: num_iter 25000 (원 설정의 50%), eval_epoch 10, full-res 는 복구 lpan 사용
seed: 2025
num_worker: 4
work_dir: /home/honbul/Desktop/song/PAN-Crafter/work_dir/combo_hf_gate_dec4_resmod

phase: train

# KNOWN_ISSUES.md E-1: 검증셋으로 best 를 고른다. 테스트셋은 곡선 기록용으로만 본다.
select_on: val

# feeder
feeder: feeders.feeder.PanFeeder
train_feeder_args:
  dataroot: /home/honbul/Desktop/song/PAN-Crafter/data/PanCollection/WV3/train_wv3.h5
  crop: True
  hflip: True
  vflip: True
  rot: True
  crop_ratio: 0.75
  ms_size: 16

val_feeder_args:
  dataroot: /home/honbul/Desktop/song/PAN-Crafter/data/PanCollection/WV3/valid_wv3.h5

test_reduced_feeder_args:
  dataroot: /home/honbul/Desktop/song/PAN-Crafter/data/PanCollection/WV3/reduced_examples_h5/test_wv3_multiExm1.h5

test_full_feeder_args:
  dataroot: /home/honbul/Desktop/song/PAN-Crafter/data/PanCollection/WV3/full_examples_h5_repaired/test_wv3_OrigScale_multiExm1.h5

# data
num_bands: 8
max_pixel: 2047.0

# model
model: model.pancrafter.PANCrafter
model_args:
  in_channels: 1
  out_channels: 8
  hidden_size: [128, 128, 128, 128]
  s_embed_size: 128
  dropout: 0.2
  use_scale_shift_norm: True
  depth: [2, 2, 2, 2]
  pan_ks: 3
  ms_ks: 3
  ka: 3
  cm3a_locations: ["3e", "4"]
  cm3a_v_pan_hf: False
  attn_mode_gate: False
  res_mode_mod: False
  # KNOWN_ISSUES.md A-1 / A-2. 둘 다 False = 저자 배포본과 완전히 동일.
  fix_key_alias: True
  fix_local_attn: True

# optim
optimizer: AdamW
learning_rate: 1e-4
weight_decay: 0.01
lr_scheduler: cosine
num_iter: 25000
num_warmup: 100

# loss
res: True
w_off: 1.0

# logging
log_iter: 100
save_iter: 999999
save_epoch: 0
eval_epoch: 10

# training
gpu: 0
batch_size: 48  # duplicate
test_batch_size: 1