# UVS K0_outkd — B0 + unweighted output KD (λ_s 0.1, 잔차 R_S−R_T). student d122(w128 d[1,2,2] 3.18M), teacher c0_hqnr cache
# 실측 params 3.1795M. 계획: research_log/2026-08-30_compression-attribution-20h-plan.md
# 공통 고정: 50K · nocrop · LN · dual MARs · best 선택 HQNR(공식 12-19)
expect_params_m: 3.1795
seed: 2025
num_worker: 4
work_dir: /home/knuvi/Desktop/song/PAN-Crafter/work_dir/UVS_K0_outkd_d122

phase: train
mars: dual
trainer: uvs                  # train_uvs.py — provided lms 입력·base, teacher cache, MS mode 만 KD/shift
uvs:
  variant: k0
  teacher_norm: work_dir/c0_hqnr/uvs_teacher/norm.json   # θ·V_GT 분위수(train 고정)
  loss: {lambda_soft: 0.1, lambda_pan: 1.0, lambda_shift: 0.25, lambda_warp: 0.0, confidence_loss_ratio: 0.1}
  variance: {alpha: 1.0, window: 5}
  shift: {search_radius: 3, softmax_temperature: 0.07, confidence_threshold: 0.35, warp_mode: bicubic, student_channels: [8, 8]}
  teacher_forcing: {s0: 5000, s1: 20000}

# KNOWN_ISSUES.md E-1: 검증셋으로 best 를 고른다. 테스트셋은 곡선 기록용으로만 본다.
select_on: hqnr

# feeder
feeder: feeders.feeder_uvs.PanFeederUVS   # cache(R_T,U_T,δ_T,c_T) 를 같은 flip/rot 로 증강해 반환
train_feeder_args:
  dataroot: /home/knuvi/Desktop/song/PAN-Crafter/data/PanCollection/WV3/train_wv3.h5
  crop: False
  hflip: True
  vflip: True
  rot: True
  crop_ratio: 0.75
  ms_size: 16
  teacher_cache: outputs/uvs_cache/c0_hqnr_wv3_train.npz   # tools/uvs_build_cache.py (b0 는 무시)

val_feeder_args:
  dataroot: /home/knuvi/Desktop/song/PAN-Crafter/data/PanCollection/WV3/valid_wv3.h5

test_reduced_feeder_args:
  dataroot: /home/knuvi/Desktop/song/PAN-Crafter/data/PanCollection/WV3/reduced_examples_h5/test_wv3_multiExm1.h5

test_full_feeder_args:
  dataroot: /home/knuvi/Desktop/song/PAN-Crafter/data/PanCollection/WV3/full_examples_h5_repaired/test_wv3_OrigScale_multiExm1.h5

# data
num_bands: 8
max_pixel: 2047.0

# model
model: model.pancrafter_paper.PANCrafterPaper
model_args:
  in_channels: 1
  out_channels: 8
  hidden_size: 128
  depth: [1, 2, 2]          # full-res / H/2 / H/4(bottleneck 4→2)
  dropout: 0.0
  num_heads: 8
  mlp_ratio: 4.0
  ks: 3                     # 논문: "local attention kernel size to k = 3" (bottleneck 포함)
  ka: 3
  norm: ln                  # 논문 Eq (5): x <- Conv(SiLU(LN(x)))
  in_mode: released
  attn_locations: []
  n_attn: 3                 # Figure 3: AttnBlock 3개 (H/2 enc, H/4 bottleneck, H/2 dec)

# optim
optimizer: AdamW
learning_rate: 1e-4
weight_decay: 0.01
lr_scheduler: cosine
num_iter: 50000
num_warmup: 100

# loss
res: True
w_off: 1.0

# logging
log_iter: 100
save_iter: 10000
save_epoch: 25
eval_epoch: 5

# training
gpu: 0
batch_size: 48  # duplicate
test_batch_size: 1