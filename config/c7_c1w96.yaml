# C7 — C1 + width 96. KD Student 후보. 3.526M
# 기반: s1_A1 (11ch·nocrop·LN·50K). best 선택: HQNR (FR 테스트셋, no-reference).
# A1 — A0 와 입력만 다르다. 11ch (PAN, up(LPAN), PAN-up(LPAN), up(MS)). 7.1730M
# A: ResBlock 정규화를 논문 Eq (5) 의 LayerNorm 으로. params 동일(7.1707M)
# 논문 충실 재구성 PAN-Crafter. 저자 배포 코드가 아니라 논문 본문·Figure 3 서술을 따른다.
# params 7.1707 M (논문 주장 7.170 M, +0.01%). 배포 코드는 9.969 M.
# 차이 근거는 model/pancrafter_paper.py 머리말 참고.
seed: 2025
num_worker: 4
work_dir: /home/knuvi/Desktop/song/PAN-Crafter/work_dir/c7_c1w96

phase: train

# KNOWN_ISSUES.md E-1: 검증셋으로 best 를 고른다. 테스트셋은 곡선 기록용으로만 본다.
select_on: hqnr

# feeder
feeder: feeders.feeder.PanFeeder
train_feeder_args:
  dataroot: /home/knuvi/Desktop/song/PAN-Crafter/data/PanCollection/WV3/train_wv3.h5
  crop: False
  hflip: True
  vflip: True
  rot: True
  crop_ratio: 0.75
  ms_size: 16

val_feeder_args:
  dataroot: /home/knuvi/Desktop/song/PAN-Crafter/data/PanCollection/WV3/valid_wv3.h5

test_reduced_feeder_args:
  dataroot: /home/knuvi/Desktop/song/PAN-Crafter/data/PanCollection/WV3/reduced_examples_h5/test_wv3_multiExm1.h5

test_full_feeder_args:
  dataroot: /home/knuvi/Desktop/song/PAN-Crafter/data/PanCollection/WV3/full_examples_h5_repaired/test_wv3_OrigScale_multiExm1.h5

# data
num_bands: 8
max_pixel: 2047.0

# model
model: model.pancrafter_paper.PANCrafterPaper
model_args:
  in_channels: 1
  out_channels: 8
  hidden_size: 96          # 논문: "All feature dimensions are fixed to C = 128"
  depth: [2, 2, 4]          # full-res / H/2 / H/4(bottleneck). 논문 미기재 -> ResBlock 총 12개가 되도록
  dropout: 0.0
  num_heads: 8
  mlp_ratio: 4.0
  ks: 3                     # 논문: "local attention kernel size to k = 3" (bottleneck 포함)
  ka: 3
  norm: ln                  # 논문 Eq (5): x <- Conv(SiLU(LN(x)))
  in_mode: released
  cm3a_pan_branch: False
  n_attn: 3                 # Figure 3: AttnBlock 3개 (H/2 enc, H/4 bottleneck, H/2 dec)

# optim
optimizer: AdamW
learning_rate: 1e-4
weight_decay: 0.01
lr_scheduler: cosine
num_iter: 50000
num_warmup: 100

# loss
res: True
w_off: 1.0

# logging
log_iter: 100
save_iter: 10000
save_epoch: 25
eval_epoch: 5

# training
gpu: 0
batch_size: 48  # duplicate
test_batch_size: 1