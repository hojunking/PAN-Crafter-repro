# L1(11ch 계열) — LR-Fuse: PixelUnshuffle 로 전 연산을 1/16 면적에서. w64·ResBlock6
# 실측 params 0.5439M. 계획: research_log/2026-08-28_architecture-search-24h-plan.md
# MARs dual 유지(출력 8ch 그대로라 성립) — m1 에서 확인된 단일모드 ERGAS 열화 교란을 배제
seed: 2025
num_worker: 4
work_dir: /home/honbul/Desktop/song/PAN-Crafter/work_dir/L1_11_lr_fuse_w64

phase: train

# KNOWN_ISSUES.md E-1: 검증셋으로 best 를 고른다. 테스트셋은 곡선 기록용으로만 본다.
select_on: hqnr

# feeder
feeder: feeders.feeder.PanFeeder
train_feeder_args:
  dataroot: /home/honbul/Desktop/song/PAN-Crafter/data/PanCollection/WV3/train_wv3.h5
  crop: False
  hflip: True
  vflip: True
  rot: True
  crop_ratio: 0.75
  ms_size: 16

val_feeder_args:
  dataroot: /home/honbul/Desktop/song/PAN-Crafter/data/PanCollection/WV3/valid_wv3.h5

test_reduced_feeder_args:
  dataroot: /home/honbul/Desktop/song/PAN-Crafter/data/PanCollection/WV3/reduced_examples_h5/test_wv3_multiExm1.h5

test_full_feeder_args:
  dataroot: /home/honbul/Desktop/song/PAN-Crafter/data/PanCollection/WV3/full_examples_h5_repaired/test_wv3_OrigScale_multiExm1.h5

# data
num_bands: 8
max_pixel: 2047.0

# model
model: model.lr_fuse.LRFuse
model_args:
  in_channels: 1
  out_channels: 8
  hidden_size: 64
  n_blocks: 6
  scale: 4
  dropout: 0.0
  norm: ln
  in_mode: released         # paper=unshuffle(PAN)+MS(24ch) / released=+LPAN 저·고주파(41ch)

# optim
optimizer: AdamW
learning_rate: 1e-4
weight_decay: 0.01
lr_scheduler: cosine
num_iter: 50000
num_warmup: 100

# loss
res: True
w_off: 1.0

# logging
log_iter: 100
save_iter: 10000
save_epoch: 25
eval_epoch: 5

# training
gpu: 0
batch_size: 48  # duplicate
test_batch_size: 1