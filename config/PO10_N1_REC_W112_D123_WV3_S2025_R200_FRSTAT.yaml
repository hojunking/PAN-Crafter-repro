phase: train

mars: ms                      # PAN mode·loss·batch 복제 제거 (단일 task)
trainer: po
po:
  case: N1
  radius_hr: 2.0                 # b (HR px), run 안에서 고정; ε 만 sample 마다 뽑는다
  protocol_id: pan_offset_rel_10h_v2_wv3_r200_frstat
  radius_profile: R200_FRSTAT
