# [사다리 L1] W96 D(1,2,4) A2 — params 45% / FLOPs 38%
# 기준 p25_s2025(W128 D(2,2,4) A3, 7.1707M). 손잡이 3개 동시 적용.
# 조합 손실은 가산 이하라는 8/22 확장실험 근거로, 손잡이 1개씩이 아니라 곡선을 그린다.
seed: 2025
num_worker: 4
work_dir: /home/honbul/Desktop/song/PAN-Crafter/work_dir/p25_L1_w96d124a2

phase: train

# KNOWN_ISSUES.md E-1: 검증셋으로 best 를 고른다. 테스트셋은 곡선 기록용으로만 본다.
select_on: val

# feeder
feeder: feeders.feeder.PanFeeder
train_feeder_args:
  dataroot: /home/honbul/Desktop/song/PAN-Crafter/data/PanCollection/WV3/train_wv3.h5
  crop: True
  hflip: True
  vflip: True
  rot: True
  crop_ratio: 0.75
  ms_size: 16

val_feeder_args:
  dataroot: /home/honbul/Desktop/song/PAN-Crafter/data/PanCollection/WV3/valid_wv3.h5

test_reduced_feeder_args:
  dataroot: /home/honbul/Desktop/song/PAN-Crafter/data/PanCollection/WV3/reduced_examples_h5/test_wv3_multiExm1.h5

test_full_feeder_args:
  dataroot: /home/honbul/Desktop/song/PAN-Crafter/data/PanCollection/WV3/full_examples_h5_repaired/test_wv3_OrigScale_multiExm1.h5

# data
num_bands: 8
max_pixel: 2047.0

# model
model: model.pancrafter_paper.PANCrafterPaper
model_args:
  in_channels: 1
  out_channels: 8
  hidden_size: 96
  depth: [1, 2, 4]
  dropout: 0.0
  num_heads: 8
  mlp_ratio: 4.0
  ks: 3                     # 논문: "local attention kernel size to k = 3" (bottleneck 포함)
  ka: 3
  n_attn: 2
  norm: ln                  # 논문 Eq (5). 기본값에 의존하지 않도록 명시

# optim
optimizer: AdamW
learning_rate: 1e-4
weight_decay: 0.01
lr_scheduler: cosine
num_iter: 25000
num_warmup: 100

# loss
res: True
w_off: 1.0

# logging
log_iter: 100
save_iter: 10000
save_epoch: 25
eval_epoch: 10

# training
gpu: 0
batch_size: 48  # duplicate
test_batch_size: 1