# [50K 확정] 재구성본 + 증강 crop 제거. config/paper_wv3.yaml 과 crop 한 항목만 다르다.
# 25K 에서 대조군 대비 ERGAS -3.42% (20/20 승, p<0.0001), FR 도 동반 개선.
# 재현 감사 2.5 후보 B 를 재구성본에서 확인한 것. 50K 로 논문 대조 가능한 수치를 낸다.
# 논문 충실 재구성 PAN-Crafter. 저자 배포 코드가 아니라 논문 본문·Figure 3 서술을 따른다.
# params 7.1707 M (논문 주장 7.170 M, +0.01%). 배포 코드는 9.969 M.
# 차이 근거는 model/pancrafter_paper.py 머리말 참고.
seed: 2025
num_worker: 4
work_dir: /home/honbul/Desktop/song/PAN-Crafter/work_dir/paper_nocrop

phase: train

# KNOWN_ISSUES.md E-1: 검증셋으로 best 를 고른다. 테스트셋은 곡선 기록용으로만 본다.
select_on: val

# feeder
feeder: feeders.feeder.PanFeeder
train_feeder_args:
  dataroot: /home/honbul/Desktop/song/PAN-Crafter/data/PanCollection/WV3/train_wv3.h5
  crop: False
  hflip: True
  vflip: True
  rot: True
  crop_ratio: 0.75
  ms_size: 16

val_feeder_args:
  dataroot: /home/honbul/Desktop/song/PAN-Crafter/data/PanCollection/WV3/valid_wv3.h5

test_reduced_feeder_args:
  dataroot: /home/honbul/Desktop/song/PAN-Crafter/data/PanCollection/WV3/reduced_examples_h5/test_wv3_multiExm1.h5

test_full_feeder_args:
  dataroot: /home/honbul/Desktop/song/PAN-Crafter/data/PanCollection/WV3/full_examples_h5_repaired/test_wv3_OrigScale_multiExm1.h5

# data
num_bands: 8
max_pixel: 2047.0

# model
model: model.pancrafter_paper.PANCrafterPaper
model_args:
  in_channels: 1
  out_channels: 8
  hidden_size: 128          # 논문: "All feature dimensions are fixed to C = 128"
  depth: [2, 2, 4]          # full-res / H/2 / H/4(bottleneck). 논문 미기재 -> ResBlock 총 12개가 되도록
  dropout: 0.0
  num_heads: 8
  mlp_ratio: 4.0
  ks: 3                     # 논문: "local attention kernel size to k = 3" (bottleneck 포함)
  ka: 3
  n_attn: 3                 # Figure 3: AttnBlock 3개 (H/2 enc, H/4 bottleneck, H/2 dec)
  norm: gn                  # 이 실행은 norm 옵션 도입 전 코드로 돌았다 = GroupNorm32. 사후 명시

# optim
optimizer: AdamW
learning_rate: 1e-4
weight_decay: 0.01
lr_scheduler: cosine
num_iter: 50000
num_warmup: 100

# loss
res: True
w_off: 1.0

# logging
log_iter: 100
save_iter: 10000
save_epoch: 25
eval_epoch: 5

# training
gpu: 0
batch_size: 48  # duplicate
test_batch_size: 1