# PA A1 — PAN 앞단 전역 정합, seed 2025 (block s1). 생성: tools/gen_pa_configs.py (템플릿 BASE_W96_D124_MSPAN_WV3_S2025). 손으로 고치지 말 것.
# 명세: research_log/PAN_A1_A3_Global_PAN_Alignment_W96_D124_2026-09-09_v2.md · 구현 train_pa.py / pa/
# B0 와 같은 골격·입력 9ch·mars ms·γβ 제거·50K AdamW 1e-4/wd0.01 cosine · aligner(0.105M) 는 같은 LR 의 param group
# A1: L_rec
# best_hqnr = best_raw(raw_original HQNR → fSCC → later step) · best_aligned · last 보존. 시트 = raw_original
expect_params_m: 2.123     # backbone 만 (aligner 0.1053M 은 smoke 가 따로 확인)
seed: 2025
num_worker: 4
work_dir: /home/knuvi/Desktop/song/PAN-Crafter/work_dir/PA_A1_REC_W96_D124_9CH_S2025

phase: train

mars: ms                      # PAN mode·loss·batch 복제 제거 (단일 task)
trainer: pa
pa:
  case: A1
  lambda_edge: 0.0
  lambda_geo: 0.0
  ramp_steps: 5000
  geometry_sigma_hr: 2.0     # r/2
  geometry_margin_hr: 11     # §6.2 (64px patch 에서 [11:53])
  init_dir: work_dir/_pa_init   # seed 별 init_unet/aligner .pt (§7.3)
  diag_iter: 500


# KNOWN_ISSUES.md E-1: 검증셋으로 best 를 고른다. 테스트셋은 곡선 기록용으로만 본다.
select_on: hqnr
fr_select_indices: "0-19"   # 논문 세트 20장 전체로 선택 (부분집합 없음)

# feeder
feeder: feeders.feeder.PanFeeder
train_feeder_args:
  dataroot: /home/knuvi/Desktop/song/PAN-Crafter/data/PanCollection/WV3/train_wv3.h5
  crop: False
  hflip: True
  vflip: True
  rot: True
  crop_ratio: 0.75
  ms_size: 16

val_feeder_args:
  dataroot: /home/knuvi/Desktop/song/PAN-Crafter/data/PanCollection/WV3/valid_wv3.h5

test_reduced_feeder_args:
  dataroot: /home/knuvi/Desktop/song/PAN-Crafter/data/PanCollection/WV3/reduced_examples_h5/test_wv3_multiExm1.h5

test_full_feeder_args:
  dataroot: /home/knuvi/Desktop/song/PAN-Crafter/data/PanCollection/WV3/full_examples_mat20/test_wv3_OrigScale_mat20.h5

# data
num_bands: 8
max_pixel: 2047.0

# model
model: model.pancrafter_paper.PANCrafterPaper
model_args:
  in_channels: 1
  out_channels: 8
  hidden_size: 96
  depth: [1, 2, 4]          # full-res / H/2 / H/4(bottleneck)
  dropout: 0.0
  num_heads: 8
  mlp_ratio: 4.0
  ks: 3                     # 논문: "local attention kernel size to k = 3" (bottleneck 포함)
  ka: 3
  norm: ln                  # 논문 Eq (5): x <- Conv(SiLU(LN(x)))
  in_mode: paper            # 논문 9ch: concat(PAN, ↑MS)
  attn_locations: []
  mode_modulation: false   # MARs mode 조건 γ/β 제거 (단일 task)
  n_attn: 3                 # Figure 3: AttnBlock 3개 (H/2 enc, H/4 bottleneck, H/2 dec)

# optim
optimizer: AdamW
learning_rate: 1e-4
weight_decay: 0.01
lr_scheduler: cosine
num_iter: 50000
num_warmup: 100

# loss
res: True
w_off: 1.0

# logging
log_iter: 100
save_iter: 10000
save_epoch: 25
eval_epoch: 5

# training
gpu: 0
batch_size: 48  # duplicate
test_batch_size: 1