# [대안 ③] 입력 9ch -> 11ch (pan, up(ms), up(lpan), pan-up(lpan)) · +2,304 params
# 7.1730 M (논문 7.170 M 대비 +0.041%) 로 논문 일치가 깨지지 않는다.
# KNOWN_ISSUES A-3 이 '본문이 축약된 것' 으로 판정한 항목이고, 빠진 pan-up(lpan) 은
# INTRO 가 '정합 보정의 실체' 라 부른 고주파 채널이다.
seed: 2025
num_worker: 4
work_dir: /home/honbul/Desktop/song/PAN-Crafter/work_dir/p25_in11

phase: train

# KNOWN_ISSUES.md E-1: 검증셋으로 best 를 고른다. 테스트셋은 곡선 기록용으로만 본다.
select_on: val

# feeder
feeder: feeders.feeder.PanFeeder
train_feeder_args:
  dataroot: /home/honbul/Desktop/song/PAN-Crafter/data/PanCollection/WV3/train_wv3.h5
  crop: True
  hflip: True
  vflip: True
  rot: True
  crop_ratio: 0.75
  ms_size: 16

val_feeder_args:
  dataroot: /home/honbul/Desktop/song/PAN-Crafter/data/PanCollection/WV3/valid_wv3.h5

test_reduced_feeder_args:
  dataroot: /home/honbul/Desktop/song/PAN-Crafter/data/PanCollection/WV3/reduced_examples_h5/test_wv3_multiExm1.h5

test_full_feeder_args:
  dataroot: /home/honbul/Desktop/song/PAN-Crafter/data/PanCollection/WV3/full_examples_h5_repaired/test_wv3_OrigScale_multiExm1.h5

# data
num_bands: 8
max_pixel: 2047.0

# model
model: model.pancrafter_paper.PANCrafterPaper
model_args:
  in_channels: 1
  out_channels: 8
  hidden_size: 128          # 논문: "All feature dimensions are fixed to C = 128"
  depth: [2, 2, 4]          # full-res / H/2 / H/4(bottleneck). 논문 미기재 -> ResBlock 총 12개가 되도록
  dropout: 0.0
  num_heads: 8
  mlp_ratio: 4.0
  ks: 3                     # 논문: "local attention kernel size to k = 3" (bottleneck 포함)
  ka: 3
  n_attn: 3
  in_mode: released         # (구) input_hf: True 와 동일 의미. 실제 학습은 구 플래그로 돌았고
                            # 입력 concat 순서만 다르다(모델 클래스는 동등). s1 의 in_mode 인터페이스로 통일
  norm: gn                  # 이 실행은 norm 옵션 도입 전 코드로 돌았다 = GroupNorm32. 사후 명시

# optim
optimizer: AdamW
learning_rate: 1e-4
weight_decay: 0.01
lr_scheduler: cosine
num_iter: 25000
num_warmup: 100

# loss
res: True
w_off: 1.0

# logging
log_iter: 100
save_iter: 10000
save_epoch: 25
eval_epoch: 10

# training
gpu: 0
batch_size: 48  # duplicate
test_batch_size: 1