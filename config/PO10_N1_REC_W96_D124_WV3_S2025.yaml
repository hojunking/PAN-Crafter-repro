# PO10 N1 — PAN 추가 변위 + offset consistency, seed 2025, 50000 updates. 생성: tools/gen_po10_configs.py (템플릿 PA_A1_REC_W96_D124_9CH_S2025). 손으로 고치지 말 것.
# 명세: research_log/PAN_OffsetConsistency_10GPUh_W96_D124_2026-09-10.md · 구현 train_po.py / pa/offset.py
# A1 과 같은 골격·9ch·mars ms·γβ 제거·AdamW 1e-4/wd0.01 cosine·batch 48·init(work_dir/_pa_init seed 2025) · aligner 고정 내부 view margin 4
# native/corrupt 1:1 (update 짝/홀). corrupt: ε ~ disk R=1.0 HR px (audit 부록 E WV3 train P90 0.250 LR px × 4). L_rec 만 (offset loss 계수 0)
# best_hqnr = best_raw(raw_original HQNR → fSCC → later step) · best_aligned · last 보존. 시트 = raw_original
expect_params_m: 2.123     # backbone 만 (aligner 0.1053M 은 smoke 가 따로 확인)
seed: 2025
num_worker: 4
work_dir: /home/knuvi/Desktop/song/PAN-Crafter/work_dir/PO10_N1_REC_W96_D124_WV3_S2025

phase: train

mars: ms                      # PAN mode·loss·batch 복제 제거 (단일 task)
trainer: po
po:
  case: N1
  radius_hr: 1.0                 # audit 부록 E: WV3 train 전역 |δ| P90 0.250 LR px × 4 (train_aggregate_proxy)
  lambda_off_max: 0.0
  ramp_updates: 5000
  diag_every: 1000
  corruption_seed_offset: 2000
  budget_total_gpu_hours: 10.0
  budget_diag_reserve_hours: 1.0
  init_dir: work_dir/_pa_init



# KNOWN_ISSUES.md E-1: 검증셋으로 best 를 고른다. 테스트셋은 곡선 기록용으로만 본다.
select_on: hqnr
fr_select_indices: "0-19"   # 논문 세트 20장 전체로 선택 (부분집합 없음)

# feeder
feeder: feeders.feeder.PanFeeder
train_feeder_args:
  dataroot: /home/knuvi/Desktop/song/PAN-Crafter/data/PanCollection/WV3/train_wv3.h5
  crop: False
  hflip: True
  vflip: True
  rot: True
  crop_ratio: 0.75
  ms_size: 16

val_feeder_args:
  dataroot: /home/knuvi/Desktop/song/PAN-Crafter/data/PanCollection/WV3/valid_wv3.h5

test_reduced_feeder_args:
  dataroot: /home/knuvi/Desktop/song/PAN-Crafter/data/PanCollection/WV3/reduced_examples_h5/test_wv3_multiExm1.h5

test_full_feeder_args:
  dataroot: /home/knuvi/Desktop/song/PAN-Crafter/data/PanCollection/WV3/full_examples_mat20/test_wv3_OrigScale_mat20.h5

# data
num_bands: 8
max_pixel: 2047.0

# model
model: model.pancrafter_paper.PANCrafterPaper
model_args:
  in_channels: 1
  out_channels: 8
  hidden_size: 96
  depth: [1, 2, 4]          # full-res / H/2 / H/4(bottleneck)
  dropout: 0.0
  num_heads: 8
  mlp_ratio: 4.0
  ks: 3                     # 논문: "local attention kernel size to k = 3" (bottleneck 포함)
  ka: 3
  norm: ln                  # 논문 Eq (5): x <- Conv(SiLU(LN(x)))
  in_mode: paper            # 논문 9ch: concat(PAN, ↑MS)
  attn_locations: []
  mode_modulation: false   # MARs mode 조건 γ/β 제거 (단일 task)
  n_attn: 3                 # Figure 3: AttnBlock 3개 (H/2 enc, H/4 bottleneck, H/2 dec)

# optim
optimizer: AdamW
learning_rate: 1e-4
weight_decay: 0.01
lr_scheduler: cosine
num_iter: 50000
num_warmup: 100

# loss
res: True
w_off: 1.0

# logging
log_iter: 100
save_iter: 10000
save_epoch: 25
eval_epoch: 5

# training
gpu: 0
batch_size: 48  # duplicate
test_batch_size: 1