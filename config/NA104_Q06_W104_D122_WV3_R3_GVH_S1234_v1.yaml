max_pixel: 2047.0

# model
model: model.pancrafter_paper.PANCrafterPaper
model_args:
  in_channels: 1
  out_channels: 8
  hidden_size: 104
  depth: [1, 2, 2]          # full-res / H/2 / H/4(bottleneck)
  dropout: 0.0
  num_heads: 8
  mlp_ratio: 4.0
  ks: 3                     # 논문: "local attention kernel size to k = 3" (bottleneck 포함)
  ka: 3
  norm: ln                  # 논문 Eq (5): x <- Conv(SiLU(LN(x)))
  in_mode: paper            # 논문 9ch: concat(PAN, ↑MS)
  attn_locations: []
  mode_modulation: false   # MARs mode 조건 γ/β 제거 (단일 task)
  n_attn: 3                 # Figure 3: AttnBlock 3개 (H/2 enc, H/4 bottleneck, H/2 dec)

# optim
optimizer: AdamW
learning_rate: 1e-4
weight_decay: 0.01
lr_scheduler: cosine
num_iter: 50000
num_warmup: 100

# loss
res: True
w_off: 1.0

# logging
