# Teacher-Teacher DML. 고정 구조는 계획 3절 — T7 7.17M / depth(2,2,4) / AttnBlock 3
# / 입력 9ch / crop False / GroupNorm / dropout 0.0. 11ch·uncertainty·SWT 는 넣지 않는다.
# M0 와 M1 은 mutual_lambda 하나만 다르다.
# M1: symmetric mutual learning.
# 논문 충실 재구성 PAN-Crafter. 저자 배포 코드가 아니라 논문 본문·Figure 3 서술을 따른다.
# params 7.1707 M (논문 주장 7.170 M, +0.01%). 배포 코드는 9.969 M.
# 차이 근거는 model/pancrafter_paper.py 머리말 참고.
seed: 2025
num_worker: 4
work_dir: /home/honbul/Desktop/song/PAN-Crafter/work_dir/dml_m1

phase: train

# KNOWN_ISSUES.md E-1: 검증셋으로 best 를 고른다. 테스트셋은 곡선 기록용으로만 본다.
select_on: val

# feeder
feeder: feeders.feeder.PanFeeder
train_feeder_args:
  dataroot: /home/honbul/Desktop/song/PAN-Crafter/data/PanCollection/WV3/train_wv3.h5
  crop: False
  hflip: True
  vflip: True
  rot: True
  crop_ratio: 0.75
  ms_size: 16

val_feeder_args:
  dataroot: /home/honbul/Desktop/song/PAN-Crafter/data/PanCollection/WV3/valid_wv3.h5

test_reduced_feeder_args:
  dataroot: /home/honbul/Desktop/song/PAN-Crafter/data/PanCollection/WV3/reduced_examples_h5/test_wv3_multiExm1.h5

test_full_feeder_args:
  dataroot: /home/honbul/Desktop/song/PAN-Crafter/data/PanCollection/WV3/full_examples_h5_repaired/test_wv3_OrigScale_multiExm1.h5

# data
num_bands: 8
max_pixel: 2047.0

# model
model: model.pancrafter_paper.PANCrafterPaper
model_args:
  in_channels: 1
  out_channels: 8
  hidden_size: 128          # 논문: "All feature dimensions are fixed to C = 128"
  depth: [2, 2, 4]          # full-res / H/2 / H/4(bottleneck). 논문 미기재 -> ResBlock 총 12개가 되도록
  dropout: 0.0
  num_heads: 8
  mlp_ratio: 4.0
  ks: 3                     # 논문: "local attention kernel size to k = 3" (bottleneck 포함)
  ka: 3
  n_attn: 3                 # Figure 3: AttnBlock 3개 (H/2 enc, H/4 bottleneck, H/2 dec)
  norm: ln                  # 논문 Eq (5). s1 50K 에서 ERGAS -1.34%(잡음 0.8% 초과).
                            # HQNR -0.24% 는 FR 8장 잡음 안이라 근거로 쓰지 않는다

# optim
optimizer: AdamW
learning_rate: 1e-4
weight_decay: 0.01
lr_scheduler: cosine
num_iter: 25000           # 이번만 25K — 빠른 판정용. cosine 도 25K 로 완결되어
                          # 기존 p25_* 계열(25K)과 가로 비교가 성립한다
num_warmup: 100

# loss
res: True
w_off: 1.0

# logging
log_iter: 100
save_iter: 10000
save_epoch: 25
eval_epoch: 10

# training
gpu: 0
batch_size: 48  # duplicate
test_batch_size: 1
# --- Teacher-Teacher DML (research_log/s2_teacher_teacher_mutual_learning_plan.md) ---
seed_b: 2026              # peer B 초기화. peer A 는 위 seed(2025)
mutual_lambda: 0.10       # 보정 결과. 실데이터 r_g=1.008 -> lambda*r_g=0.101 (목표 0.1~0.2).
                          # 계획 6절이 정한 "최초 overnight run 상한 0.1" 과도 일치한다.
mutual_warmup: 2500       # 이 스텝까지 lambda=0
mutual_ramp_end: 5000     # 여기까지 선형 증가, 이후 lambda_max
mutual_diag_iter: 500     # anchor/mutual gradient 비 r_g 측정 주기
