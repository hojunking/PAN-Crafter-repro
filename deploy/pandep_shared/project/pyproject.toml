[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pan-deploy-shared"
version = "0.1.0"
description = "Isolated PANDEP s2 Shared PLH U-Net experiment"
requires-python = ">=3.11"
dependencies = ["torch==2.4.0", "numpy==1.26.4", "scipy==1.13.1", "h5py==3.12.1", "safetensors==0.4.4", "scikit-image==0.24.0", "opencv-python-headless==4.10.0.84", "gspread==6.2.1"]

[tool.setuptools.packages.find]
where = ["src"]
